name: guardian_hat
description: "GuardianHat IoT — Smart Safety Helmet Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  mqtt_client: ^10.6.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.17
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env
